<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tra cứu bộ nhớ dịch | BasicCAT</title>
  <link href="/assets/css/style.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sax"></script>
  <script src="https://cdn.jsdelivr.net/npm/localforage@1.10.0/dist/localforage.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/nextapps-de/flexsearch@0.7.31/dist/flexsearch.bundle.js"></script>
  <script>
  var _hmt = _hmt || [];
  (function() {
    var hm = document.createElement("script");
    hm.src = "https://hm.baidu.com/hm.js?a9b7088974f73c2a43a35ec43ea3ba98";
    var s = document.getElementsByTagName("script")[0];
    s.parentNode.insertBefore(hm, s);
  })();
  </script>
</head>
<body>
  <div class="container">
    <div class="home">
      <h2>Tra cứu bộ nhớ dịch</h2>
      <div>Tệp bộ nhớ dịch:</div>
      <div>
        <ul class="files-list"></ul>
      </div>
      <div>
        Thêm tệp:
        <div>
          <div>
              <input type="file" id="file" accept=".tmx" />
          </div>
          <button class="add-button">Thêm</button>
        </div>
      </div>
    </div>
    <div class="search" style="display:none;">
      <h2>Tra cứu bộ nhớ dịch</h2>
      <div>
        <div class="search-controls">
          <div class="search-bar">
            <input type="text" class="keywords"/>
            <button class="search-button">Tìm kiếm</button>
          </div>
          <label>
            Phạm vi tìm kiếm:
            <select class="field-select">
              <option value="0">Tất cả</option>
            </select>
          </label>
          <span class="status"></span>
        </div>
        <div class="search-results"></div>
      </div>
    </div>
    <div class="viewer" style="display:none;">
    </div>
    <div class="footer">
      <button class="back-button">Quay lại</button>
      <button class="delete-button">Xóa tệp này</button>
      <div>@xulihang 2023</div>
    </div>
  </div>
  <script src="/assets/js/script.js"></script>
</body>
</html>
