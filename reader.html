<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ImageTrans Reader</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        background: #f5f5f5;      /* light theme */
        color: #2d2d2d;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-text-size-adjust: 100%;
      }

      /* Immersive full-screen scroll area for injected images. */
      /* Mobile: full width. Desktop: constrained with side margins. */
      #imagetrans-reader {
        width: 100%;
        max-width: none;
        margin: 0 auto;
        padding: 12px 0 80px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: center;
        min-height: 100vh;
        justify-content: flex-start;
      }

      /* On larger screens, add margins so images aren't flush to the edges. */
      @media (min-width: 640px) {
        #imagetrans-reader {
          max-width: 860px;   /* comfortable reading width */
          padding: 24px 40px 80px;
        }
      }

      /* Wait hint shown while the container is empty (pure CSS). */
      #imagetrans-reader:empty::after {
        content: "Waiting for the ImageTrans extension to insert images…";
        color: #8a8f98;
        font-size: 15px;
        text-align: center;
        align-self: center;
        margin: auto;
        padding: 0 16px;
      }

      /* Injected <img> elements: full width of the container. */
      /* !important overrides the inline max-width set by the extension. */
      #imagetrans-reader img {
        display: block;
        width: 100% !important;
        max-width: none !important;
        height: auto;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <div id="imagetrans-reader"></div>
  </body>
</html>
