-
    title: BasicCAT
    href: /vi
    description: BasicCAT là công cụ dịch có hỗ trợ máy tính miễn phí và mã nguồn mở. Chúng ta có thể dùng nó để dịch tài liệu, trang web, bảng tính, bài trình chiếu và nhiều hơn nữa, với các tính năng như bộ nhớ dịch, dịch máy và quản lý thuật ngữ.
    cover-src: /album/main.png
    cover-alt: BasicCAT
-
    title: ImageTrans
    href: /vi/imagetrans
    description: ImageTrans là công cụ dịch hình ảnh có hỗ trợ máy tính. Chúng ta có thể dùng nó để dịch truyện tranh, manga, poster, trang sản phẩm, v.v.
    cover-src: /album/imagetrans_zh.jpg
    cover-alt: ImageTrans
