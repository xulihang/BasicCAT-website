    cover-src: /album/silhouette/screenshot_zh.webp
    cover-alt: Silhouette
-
    title: Aligner
    href: /zh/new-tool-bitext-aligner/
    description: Aligner là công cụ căn chỉnh song ngữ. Nó trích xuất văn bản từ tài liệu, bảng tính và phụ đề rồi tự động căn chỉnh văn bản theo câu, có hỗ trợ chỉnh sửa thủ công. Bản song ngữ có thể xuất thành bộ nhớ dịch để dùng trong các công cụ khác.
    cover-src: /album/ass-aligning/home.jpg
    cover-alt: Aligner
