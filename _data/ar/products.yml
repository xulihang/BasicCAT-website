    description: BasicCAT أداة مجانية مفتوحة المصدر للترجمة بمساعدة الحاسوب. يمكن استخدامها لترجمة المستندات وصفحات الويب والجداول والعروض التقديمية وغيرها، مع ميزات مثل ذاكرة الترجمة والترجمة الآلية وإدارة المصطلحات.
