-
    title: Aligner
    href: /zh/new-tool-bitext-aligner/
    description: Aligner أداة لمحاذاة النصوص المتوازية. تستخرج النص من المستندات والجداول والترجمات، وتُحاذي النص على مستوى الجملة تلقائيًا مع دعم التعديل اليدوي. ويمكنها تصدير النص المتوازي إلى ملفات ذاكرة ترجمة لاستخدامها في أدوات أخرى.
