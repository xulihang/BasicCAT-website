-
    title: BasicCAT
    href: /ko
    description: BasicCAT은 무료 오픈 소스 컴퓨터 지원 번역 도구입니다. 번역 메모리, 기계 번역, 용어 관리 등의 기능을 활용해 문서, 웹 페이지, 표, 슬라이드 등을 번역할 수 있습니다.
    cover-src: /album/main.png
    cover-alt: BasicCAT
-
    title: ImageTrans
