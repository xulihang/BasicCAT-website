-
    title: Aligner
    href: /zh/new-tool-bitext-aligner/
    description: Aligner는 병렬 텍스트 정렬 도구입니다. 문서, 표, 자막에서 텍스트를 추출해 문장 단위로 자동 정렬하며 수동 조정도 지원합니다. 병렬 텍스트를 번역 메모리 파일로 내보내 다른 도구에서 사용할 수 있습니다.
    cover-src: /album/ass-aligning/home.jpg
    cover-alt: Aligner
