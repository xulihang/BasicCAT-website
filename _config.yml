# Site settings
header: BasicCAT
title: "BasicCAT — Computer-Aided Translation (CAT) Tools"
baseurl: "" # required if used under gh-pages branch, else (under master branch) just leave empty/blank
#url: ""
author: "xulihang"

# Languages. The English site lives at the root, the others under a prefix.
# locale   -> <html lang> and og:locale (underscore form, e.g. zh_CN)
# hreflang -> BCP 47 for <link rel="alternate" hreflang> (hyphen form, e.g. zh-CN)
# title    -> site title for <title>, shown when the page title is missing or long
languages:
  - code: en
    label: English
    url: /
    locale: en
    hreflang: en
    doclang: en/latest/
  - code: zh
    label: 中文
    url: /zh/
    locale: zh_CN
    hreflang: zh-CN
    title: "BasicCAT——计算机辅助翻译（CAT）软件"
    dateformat: "%Y年%-m月%-d日"
    doclang: zh_CN/latest/
  - code: ja
    label: 日本語
    url: /ja/
    locale: ja
    hreflang: ja
    title: "BasicCAT — コンピュータ支援翻訳（CAT）ツール"
    dateformat: "%Y年%-m月%-d日"
    # 日本語版のドキュメントサイトはまだ無いため、英語版にフォールバックします
    doclang: en/latest/
    # 機械翻訳されたページには「機械翻訳」の通知バーを表示します
    machine_translated: true
  - code: pt
    label: Português
    url: /pt/
    locale: pt_BR
    hreflang: pt-BR
    title: "BasicCAT — Ferramentas de Tradução Assistida por Computador (CAT)"
    dateformat: "%d/%m/%Y"
    # Ainda não há site de documentação em português, então usamos o inglês
    doclang: en/latest/
    # Páginas traduzidas automaticamente exibem um aviso de tradução automática
    machine_translated: true
  - code: ko
    label: 한국어
    url: /ko/
    locale: ko_KR
    hreflang: ko-KR
    title: "BasicCAT — 컴퓨터 지원 번역(CAT) 도구"
    dateformat: "%Y년 %-m월 %-d일"
    # 한국어 문서 사이트가 아직 없어 영어 버전으로 대체합니다
    doclang: en/latest/
    # 기계 번역된 페이지에는 기계 번역 안내 표시줄을 보여 줍니다
    machine_translated: true
  - code: fr
    label: Français
    url: /fr/
    locale: fr_FR
    hreflang: fr
    title: "BasicCAT — Outils de traduction assistée par ordinateur (TAO)"
    dateformat: "%d/%m/%Y"
    # Il n'existe pas encore de site de documentation en français, donc nous
    # renvoyons vers la version anglaise
    doclang: en/latest/
    # Les pages traduites automatiquement affichent un bandeau de traduction
    machine_translated: true
  - code: ar
    label: العربية
    url: /ar/
    locale: ar
    hreflang: ar
    title: "BasicCAT — أدوات الترجمة بمساعدة الحاسوب"
    dateformat: "%-d/%-m/%Y"
    # لا يوجد بعد موقع توثيق بالعربية، لذا نحيل إلى النسخة الإنجليزية
    doclang: en/latest/
    # الصفحات المترجمة آليًا تعرض شريط تنبيه بالترجمة الآلية
    machine_translated: true
    # اللغة تُكتب من اليمين إلى اليسار، فيُضاف dir="rtl" إلى وسم <html>
    rtl: true

# Build settings
kramdown:
  input: GFM
permalink: /:title/

# Third-party services
# just leave empty to disable it
google_analytics:
disqus_shortname: 
sitemap: true
plugins:
  - jekyll-sitemap
  - jekyll-relative-links

exclude: ["LICENSE", "README.md", "CNAME", "vendor", "Gemfile", "script"]

defaults:
  - scope:
      path: "_zh"
    values:
      locale: "zh_CN"
      lang: "zh"
  - scope:
      path: "zh"
    values:
      locale: "zh_CN"
      lang: "zh"
  - scope:
      path: "ja"
    values:
      locale: "ja"
      lang: "ja"
  - scope:
      path: "pt"
    values:
      locale: "pt_BR"
      lang: "pt"
  - scope:
      path: "ko"
    values:
      locale: "ko_KR"
      lang: "ko"
  - scope:
      path: "fr"
    values:
      locale: "fr_FR"
      lang: "fr"
  - scope:
      path: "ar"
    values:
      locale: "ar"
      lang: "ar"
      rtl: true

collections:
  zh:
    output: true
    permalink: /:collection/:title/
  # 日本語版のブログ記事はまだ翻訳していないため、現時点では空のコレクションです。
  # _ja ディレクトリに記事を追加すれば、/ja/blog/ と /ja/tagged/ に反映されます。
  ja:
    output: true
    permalink: /:collection/:title/
  # Ainda não há artigos de blog traduzidos para o português, então a coleção
  # está vazia. Adicione artigos em _pt para que apareçam em /pt/blog/.
  pt:
    output: true
    permalink: /:collection/:title/
  # 아직 한국어로 번역된 블로그 글이 없어 비어 있는 컬렉션입니다.
  # _ko 디렉터리에 글을 추가하면 /ko/blog/ 와 /ko/tagged/ 에 반영됩니다.
  ko:
    output: true
    permalink: /:collection/:title/
  # Aucun article de blog n'est encore traduit en français, la collection est
  # donc vide. Ajoutez des articles dans _fr pour qu'ils apparaissent dans
  # /fr/blog/ et /fr/tagged/.
  fr:
    output: true
    permalink: /:collection/:title/
  # لا توجد بعد مقالات مدونة مترجمة إلى العربية، لذا المجموعة فارغة.
  # أضف مقالات في _ar لتظهر في /ar/blog/ و /ar/tagged/.
  ar:
    output: true
    permalink: /:collection/:title/
    
relative_links:
  enabled:     true
  collections: true
  
